name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify tag and build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python -c "import os; from packaging.version import Version;
          from document_parser import __version__;
          assert Version(os.environ['RELEASE_TAG'].removeprefix('v')) == Version(__version__)"
      - name: Run quality and test gates
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m mypy src tests
          python -m pytest
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Verify installed wheel and create runtime SBOM
        run: |
          python -m venv .release-runtime
          .release-runtime/bin/python -m pip install dist/*.whl
          .release-runtime/bin/document-parser version
          cyclonedx-py environment .release-runtime/bin/python --pyproject pyproject.toml --mc-type library --output-reproducible --output-file=sbom.json
          sha256sum dist/* > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/
            sbom.json
            SHA256SUMS
          if-no-files-found: error

  github-release:
    name: Create GitHub prerelease
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            dist/*
            sbom.json
            SHA256SUMS

  pypi:
    name: Publish to PyPI with trusted publishing
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.ref_name }}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
