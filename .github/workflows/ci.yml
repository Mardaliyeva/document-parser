name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type-check
        run: python -m mypy src tests

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest

  minimum-runtime:
    name: Minimum runtime dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install with the minimum supported Pydantic line
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -e ".[dev]"
          "defusedxml==0.7.1"
          "lxml==5.*"
          "openpyxl==3.1.5"
          "pdfplumber==0.11.10"
          "pillow==12.2.*"
          "pydantic==2.10.*"
          "pypdf==6.16.2"
          "python-docx==1.2.0"
      - name: Run tests
        run: python -m pytest

  optional-ocr:
    name: OCR extra install (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install optional OCR integration
        run: python -m pip install --upgrade pip && python -m pip install -e ".[ocr]"
      - name: Verify lazy base import and renderer dependencies
        run: >-
          python -c "import sys, platformdirs, pypdfium2; import document_parser;
          assert 'paddleocr' not in sys.modules;
          assert document_parser.__version__ == '0.6.0a1'"

  package:
    name: Build package
    needs: [minimum-runtime, optional-ocr, quality, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build wheel and source archive
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Verify wheel in a clean environment
        shell: bash
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/python -c "import document_parser; print(document_parser.__version__)"
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  licenses:
    name: Dependency and SBOM audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Create an isolated runtime environment
        shell: bash
        run: |
          python -m venv --without-pip .runtime-audit-venv
          python -m pip --python .runtime-audit-venv install .
          python -m venv --without-pip .ocr-audit-venv
          python -m pip --python .ocr-audit-venv install ".[ocr]"
      - name: Enforce the runtime dependency license policy
        shell: bash
        run: >-
          python -m piplicenses
          --python .runtime-audit-venv/bin/python
          --allow-only="Apache-2.0;Apache Software License;Apache-2.0 OR BSD-3-Clause;MIT;MIT-0;MIT-CMU;MIT License;BSD-2-Clause;BSD-3-Clause;BSD License;BSD-3-Clause, Apache-2.0, dependency licenses;ISC;ISC License (ISCL);Python-2.0;PSF-2.0;Python Software Foundation License"
      - name: Create dependency reports
        shell: bash
        run: |
          python -m piplicenses --python .runtime-audit-venv/bin/python --format=json --output-file=licenses.json
          cyclonedx-py environment .runtime-audit-venv/bin/python --pyproject pyproject.toml --mc-type library --output-reproducible --output-file sbom.json
      - name: Enforce the OCR-extra dependency license policy
        shell: bash
        run: >-
          python -m piplicenses
          --python .ocr-audit-venv/bin/python
          --allow-only="Apache-2.0;Apache Software License;Apache-2.0 OR BSD-3-Clause;MIT;MIT-0;MIT-CMU;MIT License;BSD-2-Clause;BSD-3-Clause;BSD License;BSD-3-Clause, Apache-2.0, dependency licenses;ISC;ISC License (ISCL);Python-2.0;PSF-2.0;Python Software Foundation License;GNU Library or Lesser General Public License (LGPL);LGPL-3.0-or-later;GNU Lesser General Public License v3 or later (LGPLv3+)"
      - name: Create OCR-extra dependency reports
        shell: bash
        run: |
          python -m piplicenses --python .ocr-audit-venv/bin/python --format=json --output-file=ocr-licenses.json
          cyclonedx-py environment .ocr-audit-venv/bin/python --pyproject pyproject.toml --mc-type library --output-reproducible --output-file=ocr-sbom.json
      - uses: actions/upload-artifact@v7
        with:
          name: dependency-audit
          path: |
            licenses.json
            ocr-licenses.json
            ocr-sbom.json
            sbom.json
          if-no-files-found: error
