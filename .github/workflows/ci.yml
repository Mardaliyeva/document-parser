name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type-check
        run: python -m mypy src tests

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest

  minimum-runtime:
    name: Minimum runtime dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install with the minimum supported Pydantic line
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" "pydantic==2.10.*"
      - name: Run tests
        run: python -m pytest

  package:
    name: Build package
    needs: [minimum-runtime, quality, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build wheel and source archive
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Verify wheel in a clean environment
        shell: bash
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/python -c "import document_parser; print(document_parser.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  licenses:
    name: Dependency and SBOM audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Create an isolated runtime environment
        shell: bash
        run: |
          python -m venv --without-pip .runtime-audit-venv
          python -m pip --python .runtime-audit-venv install .
      - name: Enforce the runtime dependency license policy
        shell: bash
        run: >-
          python -m piplicenses
          --python .runtime-audit-venv/bin/python
          --allow-only="Apache-2.0;Apache Software License;MIT;MIT License;BSD-2-Clause;BSD-3-Clause;BSD License;ISC;ISC License (ISCL);Python-2.0;PSF-2.0;Python Software Foundation License"
      - name: Create dependency reports
        shell: bash
        run: |
          python -m piplicenses --python .runtime-audit-venv/bin/python --format=json --output-file=licenses.json
          cyclonedx-py environment .runtime-audit-venv/bin/python --pyproject pyproject.toml --mc-type library --output-reproducible --output-file sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: |
            licenses.json
            sbom.json
          if-no-files-found: error
